# Redundant edge-path keep-alive for the free Render deployment.
#
# keep-awake.yml calls Render directly. This job calls the public Cloudflare
# Worker URL, so it also exercises the same proxy path used by the browser.
# It is intentionally offset by five minutes to reduce the chance that both
# scheduled jobs miss the same GitHub Actions scheduling window.

name: Keep the public API path awake

on:
    schedule:
        - cron: "5,15,25,35,45,55 * * * *"
    workflow_dispatch:

concurrency:
    group: keep-awake-edge
    cancel-in-progress: false

permissions: {}

jobs:
    ping:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Ping the public worker API path
              run: |
                  URL="https://www.rentmanagerke.workers.dev/api/v1/public/mobile/config"
                  code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 300 --retry 2 --retry-delay 30 "$URL")
                  echo "HTTP $code from $URL"
                  if [ "$code" = "000" ]; then
                      echo "::error::No response from the public API path."
                      exit 1
                  fi

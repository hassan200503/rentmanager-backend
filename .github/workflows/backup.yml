name: Database backup

# Off-site, encrypted backups without paying for storage: this runs on
# GitHub's schedule, dumps the managed database, encrypts it with a passphrase
# only you hold, and keeps it as a workflow artifact.
#
# Required repository secrets:
#   BACKUP_DATABASE_URL  postgres://user:pass@host/db?sslmode=require  (Neon)
#   BACKUP_PASSPHRASE    a long random passphrase — STORE IT IN YOUR PASSWORD
#                        MANAGER. Without it the backups cannot be restored.
#
# Restore:
#   gpg --decrypt --batch --passphrase "$BACKUP_PASSPHRASE" backup.dump.gpg > backup.dump
#   pg_restore --clean --if-exists --no-owner -d "$TARGET_URL" backup.dump

on:
  schedule:
    - cron: "30 1 * * *"   # 04:30 Nairobi
  workflow_dispatch:

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Must be >= the server's major version. Neon runs PostgreSQL 18 on this
      # project, and pg_dump refuses outright to dump a server newer than
      # itself ("aborting because of server version mismatch") -- so a client
      # pinned to 16 would have failed every night no matter how correct the
      # two secrets were. Check the server version before bumping Neon, not
      # after.
      - name: Install PostgreSQL 18 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          # Installing the package is not enough. /usr/bin/pg_dump belongs to
          # postgresql-client-common and is a wrapper that dispatches to a
          # versioned binary; on the runner, which already ships client 16, it
          # kept choosing 16 even with 18 installed -- so the dump still died
          # with "server version mismatch". Put the versioned directory first
          # on PATH for every later step. GITHUB_PATH does not affect the step
          # that writes it, which is why the check below is its own step.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Prove the client can dump this server
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          pg_dump --version
          client_major="$(pg_dump --version | grep -oE '[0-9]+' | head -1)"
          server_major="$(psql "$DATABASE_URL" -tAc 'SHOW server_version_num' | cut -c1-2)"
          echo "client major: $client_major, server major: $server_major"
          if [ "$client_major" -lt "$server_major" ]; then
            echo "::error::pg_dump $client_major cannot dump a PostgreSQL $server_major server. Install a client >= the server's major version."
            exit 1
          fi

      - name: Dump, encrypt and verify
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" && test -n "$PASSPHRASE"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          pg_dump --format=custom --compress=6 --no-owner --file="rentmanager-$stamp.dump" "$DATABASE_URL"
          # An unreadable backup is worse than none: prove the dump lists its
          # own contents, and that the encrypted copy decrypts, before keeping it.
          #
          # Written to a file rather than piped to head. `pg_restore --list |
          # head -5` fails under `set -o pipefail`: head closes the pipe after
          # five lines, pg_restore dies of a broken pipe, and the whole step
          # reports failure even though the dump was perfect. That is exactly
          # how this step failed on its first real run -- a green dump reported
          # as a red backup, which is the worst direction for that error to go.
          pg_restore --list "rentmanager-$stamp.dump" > /tmp/toc.txt
          head -5 /tmp/toc.txt
          # A dump of an empty or wrong database would also "succeed", so
          # require a plausible table of contents.
          toc_entries="$(grep -c ';' /tmp/toc.txt || true)"
          echo "table-of-contents entries: $toc_entries"
          if [ "$toc_entries" -lt 20 ]; then
            echo "::error::Only $toc_entries TOC entries -- this does not look like the RentManager database."
            exit 1
          fi
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" \
              --output "rentmanager-$stamp.dump.gpg" "rentmanager-$stamp.dump"
          gpg --batch --yes --decrypt --passphrase "$PASSPHRASE" \
              --output /tmp/roundtrip.dump "rentmanager-$stamp.dump.gpg"
          cmp "rentmanager-$stamp.dump" /tmp/roundtrip.dump
          rm -f "rentmanager-$stamp.dump" /tmp/roundtrip.dump /tmp/toc.txt
          ls -lh "rentmanager-$stamp.dump.gpg"
          echo "name=rentmanager-$stamp" >> "$GITHUB_OUTPUT"
        id: dump

      - name: Keep it for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: "*.dump.gpg"
          retention-days: 90
          if-no-files-found: error

# RentManager — single-host production stack.
#
#   Internet ──443──▶ caddy ──▶ web:3000      (APP_DOMAIN: web app, /api/v1 proxied to backend)
#                          └──▶ backend:8080  (API_DOMAIN: mobile app, M-Pesa callbacks, Clerk webhook)
#                                   │
#                               postgres:5432 (internal network only, never published)
#
# Only Caddy publishes ports. Postgres, the backend (8080) and its management
# port (8081: health + metrics) are reachable from the internal network only.
# That matters twice: the backend trusts X-Forwarded-For from private-network
# hops, and 8081 must never be public.
#
# Secrets are passed per service, not with a shared env_file, so the web
# container never sees the database password or the encryption keys.
#
# Usage: see deploy/README.md.

name: rentmanager

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentmanager}
      POSTGRES_USER: ${POSTGRES_USER:-rentmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  backend:
    <<: *restart
    build:
      context: ${BACKEND_SRC:-..}
    image: rentmanager-backend:${RELEASE:-latest}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: ${BACKEND_MEMORY:-1536m}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-rentmanager}
      DB_USERNAME: ${POSTGRES_USER:-rentmanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Generated by you — required.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DARAJA_CREDENTIALS_ENCRYPTION_KEY: ${DARAJA_CREDENTIALS_ENCRYPTION_KEY:?set DARAJA_CREDENTIALS_ENCRYPTION_KEY}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # Identity — required.
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:?set CLERK_JWKS_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?set APP_DOMAIN}
      PLATFORM_BRANDING_NAME: ${PLATFORM_BRANDING_NAME:-RentManager}
      # Providers — optional; each feature fails closed until set.
      DARAJA_BASE_URL: ${DARAJA_BASE_URL:-https://sandbox.safaricom.co.ke}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_SHORT_CODE: ${DARAJA_SHORT_CODE:-}
      DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
      DARAJA_CALLBACK_SECRET: ${DARAJA_CALLBACK_SECRET:-}
      DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL:-}
      DARAJA_RENT_PAYMENT_CALLBACK_URL: ${DARAJA_RENT_PAYMENT_CALLBACK_URL:-}
      DARAJA_SUBSCRIPTION_BILLING_CALLBACK_URL: ${DARAJA_SUBSCRIPTION_BILLING_CALLBACK_URL:-}
      DARAJA_RATIBA_CALLBACK_URL: ${DARAJA_RATIBA_CALLBACK_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      AT_ENABLED: ${AT_ENABLED:-false}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      AT_BASE_URL: ${AT_BASE_URL:-https://api.sandbox.africastalking.com/version1/messaging}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      PUSH_EXPO_ACCESS_TOKEN: ${PUSH_EXPO_ACCESS_TOKEN:-}
      MOBILE_MINIMUM_VERSION: ${MOBILE_MINIMUM_VERSION:-1.0.0}
      MOBILE_LATEST_VERSION: ${MOBILE_LATEST_VERSION:-1.0.0}
      MOBILE_ANDROID_STORE_URL: ${MOBILE_ANDROID_STORE_URL:-}
      MOBILE_IOS_STORE_URL: ${MOBILE_IOS_STORE_URL:-}
    networks: [internal]

  web:
    <<: *restart
    build:
      context: ${WEB_SRC:-../../rentmanager-frontend}
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        # Same origin: the browser calls /api/v1 on the web domain and Next
        # proxies it to the backend, so the CSP stays 'self' and no CORS.
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api/v1
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_APP_VERSION: ${RELEASE:-1.0.0}
        NEXT_PUBLIC_SENTRY_DSN: ${WEB_SENTRY_DSN:-}
        BACKEND_URL: http://backend:8080
    image: rentmanager-web:${RELEASE:-latest}
    depends_on:
      backend: { condition: service_healthy }
    mem_limit: ${WEB_MEMORY:-512m}
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEB_WEBHOOK_SIGNING_SECRET:-}
    networks: [internal]

  caddy:
    <<: *restart
    image: caddy:2-alpine
    depends_on: [web, backend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # Nightly logical backup, 14 days kept on this host. Copy ./backups off the
  # machine as well (see README) — a backup on the same disk is not a backup.
  backup:
    <<: *restart
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-rentmanager}
      PGUSER: ${POSTGRES_USER:-rentmanager}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:

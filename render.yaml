# Render Blueprint — free-tier API for RentManager.
#
# Free instances are 512 MB RAM / 0.1 CPU and spin down after 15 minutes
# without traffic; a cron ping keeps this one awake (see
# deploy/FREE_NO_CARD.md). The database is Neon, not Render's free Postgres,
# which is deleted 30 days after creation.
#
# Secrets are NOT in this file: every `sync: false` value is typed into the
# Render dashboard once.
services:
  - type: web
    name: rentmanager-api
    runtime: docker
    plan: free
    region: frankfurt          # closest free region to Kenya
    dockerfilePath: ./Dockerfile
    # Health check must be on the single port Render routes to. /actuator lives
    # on the internal management port and is deliberately unreachable.
    healthCheckPath: /api/v1/public/mobile/config
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: APP_DEPLOYMENT_STRICT
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      # Fits a 512 MB box: serial GC and light JIT trade throughput for memory
      # and a faster cold start on a tenth of a CPU. Lazy initialisation is
      # deliberately NOT used — it would leave the @Scheduled payment and
      # notification sweeps uninstantiated.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError
      - key: DB_POOL_MAX
        value: "5"             # Neon free allows few connections
      # Typed in the dashboard (never committed):
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DARAJA_CREDENTIALS_ENCRYPTION_KEY
        sync: false           # generate once, keep a copy: see the runbook
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # https://<your-netlify-site>
      - key: TRUSTED_PROXIES
        sync: false           # Render's proxy range; see the runbook

# Test-only values for settings the application refuses to start without.
#
# Loaded for EVERY test context regardless of profile (several suites do not
# activate "test"), and layered over src/main/resources/application.yml rather
# than replacing it: a .properties file of the same name is read in addition to
# the .yml, with higher precedence.
#
# Local runs used to get these from the developer's .env via spring-dotenv; CI
# has no .env, so every Spring context failed on GitHub Actions. These are not
# secrets and must never be used outside tests.

# base64("test-only-key-not-for-production") — exactly 32 bytes, as required.
daraja.credentials-encryption-key=dGVzdC1vbmx5LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24=
application.security.jwtSecret=test-only-jwt-secret-not-for-production-use

spring:
  application:
    name: rentmanager-backend

  # Uploads: property/unit media and maintenance photos validate at 5 MB.
  # Without this Spring's 1 MB default rejected anything larger before the
  # validation ran, as an opaque 500.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentmanager}
    username: ${DB_USERNAME:rentmanager}
    password: ${DB_PASSWORD:rentmanager}

    hikari:
      # Small free-tier databases allow few connections (Neon free, for one).
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CLERK_JWKS_URL:https://social-monitor-54.clerk.accounts.dev/.well-known/jwks.json}

# OpenAPI: useful locally (the mobile contract snapshot is generated from it),
# but a complete public map of the API in production. Deployments set
# API_DOCS_ENABLED=false; DeploymentSafetyGuard refuses to start otherwise.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}




flyway:
  enabled: true
  locations: classpath:db/migration
  out-of-order: false



server:
  # PORT first: container platforms (Render, Koyeb, Cloud Run) assign it and
  # route only to that port. SERVER_PORT stays for the self-hosted stack.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

  # Finish in-flight requests instead of severing them mid-transaction on
  # deploy. Without this a rolling restart can kill a thread between the
  # M-Pesa callback writing a ledger row and the disbursement being created.
  shutdown: graceful

  # Behind the reverse proxy, trust X-Forwarded-For only from private-network
  # hops (Tomcat RemoteIpValve defaults) so getRemoteAddr() is the real client.
  # The public reservation rate limit keys on it; reading the left-most header
  # entry directly let any caller pick a fresh bucket per request.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

  tomcat:
    remoteip:
      # Which hops may set X-Forwarded-For. The default covers private ranges,
      # which is right when our own Caddy is the only proxy. On a managed
      # platform the proxy has a public address, so its range must be added
      # here (see deploy/FREE_NO_CARD.md) — otherwise every request appears to
      # come from the platform's proxy and the per-IP reservation limit becomes
      # one shared bucket. Never widen this to '.*': that would let a caller
      # forge the header and mint a fresh bucket per request.
      internal-proxies: ${TRUSTED_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}

application:
  security:
    issuer: ${JWT_ISSUER:rentmanager-backend}
    jwtSecret: ${JWT_SECRET:dev-secret-change-me}
    accessTokenExpiration: ${ACCESS_TOKEN_EXPIRATION:3600s}
    refreshTokenExpiration: ${REFRESH_TOKEN_EXPIRATION:86400s}
    bcryptStrength: ${BCRYPT_STRENGTH:12}
    enableHttpsOnlyCookies: true
    enableSecureHeaders: true

# Optional at startup: unset values disable repair/property photo upload
# (clear error at use) instead of refusing to boot. Same for the Daraja
# callback values below — callbacks with a blank secret are always rejected.
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}



daraja:
  consumer-key: ${DARAJA_CONSUMER_KEY:YOUR_CONSUMER_KEY}
  consumer-secret: ${DARAJA_CONSUMER_SECRET:YOUR_CONSUMER_SECRET}
  business-short-code: ${DARAJA_SHORT_CODE:174379}
  passkey: ${DARAJA_PASSKEY:YOUR_DARAJA_PASSKEY}
  callback-url: ${DARAJA_CALLBACK_URL:}
  rent-payment-callback-url: ${DARAJA_RENT_PAYMENT_CALLBACK_URL:}
  subscription-billing-callback-url: ${DARAJA_SUBSCRIPTION_BILLING_CALLBACK_URL:}
  ratiba-enabled: ${DARAJA_RATIBA_ENABLED:false}
  ratiba-callback-url: ${DARAJA_RATIBA_CALLBACK_URL:}
  ratiba-create-standing-order-url: ${DARAJA_RATIBA_CREATE_STANDING_ORDER_URL:https://sandbox.safaricom.co.ke/standingorder/v1/createStandingOrderExternal}
  base-url: ${DARAJA_BASE_URL:https://sandbox.safaricom.co.ke}
  callback-secret: ${DARAJA_CALLBACK_SECRET:}
  credentials-encryption-key: ${DARAJA_CREDENTIALS_ENCRYPTION_KEY}

# Integrations Control Plane: master key encrypting platform-level provider
# credentials (overrides the legacy DARAJA_CREDENTIALS_ENCRYPTION_KEY when set).
integration:
  encryption-key: ${INTEGRATION_ENCRYPTION_KEY:${DARAJA_CREDENTIALS_ENCRYPTION_KEY:}}

# Subscription billing lifecycle (Phase 1 dual revenue model):
# grace-days - premium benefits continue this long after a failed renewal
# before the scheduler auto-reverts the landlord to COMMISSION.
# payment-request-expiry-minutes - stale STK pushes without a Daraja
# callback are swept as EXPIRED after this window.
subscription-billing:
  grace-days: ${SUBSCRIPTION_GRACE_DAYS:7}
  payment-request-expiry-minutes: ${SUBSCRIPTION_PAYMENT_EXPIRY_MINUTES:30}




clerk:
  secret-key: ${CLERK_SECRET_KEY:YOUR_CLERK_SECRET_KEY}
  webhook-secret: ${CLERK_WEBHOOK_SECRET:}
  base-url: https://api.clerk.com/v1
  jwt-template-name: backend



africastalking:
  enabled: ${AT_ENABLED:false}
  api-key: ${AT_API_KEY:YOUR_AT_API_KEY}
  username: ${AT_USERNAME:sandbox}
  sender-id: ${AT_SENDER_ID:}
  base-url: ${AT_BASE_URL:https://api.sandbox.africastalking.com/version1/messaging}

# Public platform identity served by GET /api/v1/public/platform/branding.
# branding-name is the display name shown next to the system logo across
# every chrome surface (console, shells, landing page, favicon, emails).
platform:
  branding-name: ${PLATFORM_BRANDING_NAME:RentManager}

# Phase 5 notification outbox. SMS goes through africastalking above;
# email requires SMTP settings AND app.notification.email.enabled=true
# (JavaMailEmailService is not created otherwise - LoggingEmailService
# takes over). WhatsApp has no provider yet: LoggingWhatsAppService logs
# and skips until one is selected and configured.
app:
  # Deployment image sets APP_DEPLOYMENT_STRICT=true: DeploymentSafetyGuard
  # then refuses unsafe settings (see that class).
  deployment:
    strict: ${APP_DEPLOYMENT_STRICT:false}

  notification:
    email:
      enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    retry-fixed-rate-ms: ${NOTIFICATION_RETRY_FIXED_RATE_MS:300000}

  # Announcement broadcast fan-out. Delivery rows are dispatched in paced
  # batches on a single dispatch thread (batch-size rows per pass, one pass
  # every drain-delay-ms when draining right after a send) - the throttle
  # that keeps SMS/WhatsApp within provider rate limits. The scheduled
  # sweep below is the retry safety net and also paces the fan-out if the
  # immediate drain is ever down. WhatsApp messages go through the
  # registered Utility template; the landlord's text is truncated to
  # whatsapp-max-chars before injection into {{1}}.
  announcement:
    dispatch-fixed-rate-ms: ${ANNOUNCEMENT_DISPATCH_FIXED_RATE_MS:10000}
    batch-size: ${ANNOUNCEMENT_DISPATCH_BATCH_SIZE:10}
    drain-delay-ms: ${ANNOUNCEMENT_DRAIN_DELAY_MS:2000}
    whatsapp-template-name: ${ANNOUNCEMENT_WHATSAPP_TEMPLATE_NAME:announcement_utility_v1}
    whatsapp-max-chars: ${ANNOUNCEMENT_WHATSAPP_MAX_CHARS:500}
# ── Lifecycle ─────────────────────────────────────────────────────────────
spring.lifecycle:
  # Long enough for a Daraja call in flight to finish, short enough that a
  # deploy is not held hostage by one stuck request.
  timeout-per-shutdown-phase: 30s

# ── Operations ────────────────────────────────────────────────────────────
#
# Only health and metrics are exposed, and only over the management port.
# The default actuator surface includes /env, /configprops, /heapdump and
# /threaddump — all of which leak configuration or memory contents, and all
# of which SecurityConfig would have to be trusted to block one path at a
# time. Not exposing them is the stronger guarantee.
management:
  # Bound to its own port so the metrics endpoint is not reachable on the
  # public one. /actuator/prometheus reports transaction volumes, payout
  # counts and tenant cardinality — a competitor reading it learns the size
  # of the business, and an attacker learns when the system is busy.
  #
  # A Prometheus scraper cannot present a Clerk JWT, so authenticating this
  # endpoint is not an option; keeping the port off the public router is.
  # THIS PORT MUST NOT BE PUBLICLY ROUTED.
  server:
    port: ${MANAGEMENT_PORT:8081}

  endpoints:
    web:
      exposure:
        # /actuator/health, /actuator/health/liveness, /actuator/health/readiness
        # and /actuator/prometheus. Nothing else.
        include: health,prometheus
      base-path: /actuator

  endpoint:
    health:
      # Component detail (database up/down) is useful when probing by hand and
      # is not sensitive: it says a dependency is reachable, not how to reach it.
      show-details: when-authorized
      show-components: always
      probes:
        # Splits liveness (is the JVM wedged — restart me) from readiness (can
        # I serve traffic yet — hold the load balancer). Conflating them means
        # a slow migration on startup gets the container killed instead of
        # waited for.
        enabled: true

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  metrics:
    tags:
      # Every metric carries these, so one dashboard can separate environments
      # without a separate scrape config per deployment.
      application: rentmanager-backend
      # The resolved Spring property, not the raw env var: a profile passed
      # as -Dspring-boot.run.profiles or spring.profiles.active would
      # otherwise be tagged "prod" because SPRING_PROFILES_ACTIVE is unset,
      # and a dashboard that mislabels which environment it is showing is
      # worse than one with no label.
      environment: ${spring.profiles.active:prod}

  prometheus:
    metrics:
      export:
        enabled: true

# ── Logging ───────────────────────────────────────────────────────────────
#
# Every line carries the trace id set by TraceIdFilter. Without it a stack
# trace in an aggregator cannot be tied to the request that produced it, or
# to the error_events row written at the same moment — which is the state
# this project was in, since ErrorTrackingService read a traceId that nothing
# ever set.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-no-trace}] --- [%15.15t] %-40.40logger{39} : %m%n"
  level:
    com.rentmanager: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

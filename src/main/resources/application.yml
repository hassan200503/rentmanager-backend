spring:
  application:
    name: rentmanager-backend

  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentmanager}
    username: ${DB_USERNAME:rentmanager}
    password: ${DB_PASSWORD:rentmanager}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none # IMPORTANT: Flyway owns schema (prevents your crash)
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://social-monitor-54.clerk.accounts.dev/.well-known/jwks.json

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

application:
  security:
    issuer: ${JWT_ISSUER:rentmanager-backend}
    jwtSecret: ${JWT_SECRET:dev-secret-change-me}
    accessTokenExpiration: ${ACCESS_TOKEN_EXPIRATION:3600s}
    refreshTokenExpiration: ${REFRESH_TOKEN_EXPIRATION:86400s}
    bcryptStrength: ${BCRYPT_STRENGTH:12}
    enableHttpsOnlyCookies: true
    enableSecureHeaders: true
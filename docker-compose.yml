# Local development dependencies for RentManager.
#
# PostgreSQL is the only service the application actually connects to.
#
# Redis, Zookeeper and Kafka were previously defined here and were removed:
# pom.xml declares no Redis, Kafka or Spring Cloud Stream client, and nothing
# in src/main/java references them. They cost memory and ports and implied a
# streaming architecture the system does not have. Asynchronous work is done
# with a transactional outbox (notification_deliveries, announcement_deliveries)
# drained by @Scheduled sweeps — the right pattern at this scale, and it needs
# no broker. If a broker is ever genuinely required, add it back together with
# the dependency and the code that uses it, in the same change.

services:

  postgres:
    image: postgres:16-alpine
    container_name: rentmanager-postgres
    environment:
      POSTGRES_DB: rentmanager
      POSTGRES_USER: rentmanager
      POSTGRES_PASSWORD: rentmanager
    ports:
      - "5432:5432"
    volumes:
      - rm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rm_postgres_data:
